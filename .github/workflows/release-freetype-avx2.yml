name: Release FreeType AVX2

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v1.0.0); leave empty for a master nightly build'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-freetype-avx2-${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly') }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly') }}
      RELEASE_NAME: Sixboxx64ReleaseFreetypeAVX2

    steps:
      - name: Check out build source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG == 'nightly' && github.sha || format('refs/tags/{0}', env.RELEASE_TAG) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate nightly branch
        if: env.RELEASE_TAG == 'nightly'
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw 'Nightly builds must run from master.'
          }

      - name: Validate release tag
        if: env.RELEASE_TAG != 'nightly'
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9][0-9A-Za-z._+-]*$') {
            throw 'Use a version tag such as v1.0.0 or v1.0.0-rc.1.'
          }
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
          if ($tagCommit -ne (git rev-parse HEAD)) { throw 'Checkout does not match the release tag.' }

      - name: Check out matching ImGui FreeType backend
        uses: actions/checkout@v7
        with:
          repository: ocornut/imgui
          ref: v1.92.7
          path: .builds/release/imgui
          sparse-checkout: |
            misc/freetype
            imgui.h
            LICENSE.txt
          persist-credentials: false

      - name: Check out FreeType
        uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: VER-2-14-3
          path: .builds/release/freetype
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore Boost
        run: |
          nuget restore Unibox.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Build FreeType and AVX2 DLL
        run: ./.github/scripts/build-release-freetype.ps1

      - name: Save release bundle
        uses: actions/upload-artifact@v7
        with:
          name: Sixbox-FreeType-AVX2-${{ env.RELEASE_TAG }}
          path: output/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.RELEASE_TAG != 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem output/release -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            $options = @('--verify-tag', '--title', "Sixbox TF2 $env:RELEASE_TAG (FreeType AVX2)", '--generate-notes')
            if ($env:RELEASE_TAG -match '-') { $options += '--prerelease' }
            gh release create $env:RELEASE_TAG @assets @options
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Publish rolling nightly release
        if: env.RELEASE_TAG == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A queued old build must never replace a newer master build.
          $head = gh api "repos/$env:GH_REPO/git/ref/heads/master" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read master HEAD.' }
          if ($head -ne $env:GITHUB_SHA) {
            Write-Host 'Master advanced during this build; keeping artifacts and skipping nightly publication.'
            exit 0
          }

          $tagCount = gh api "repos/$env:GH_REPO/git/matching-refs/tags/nightly" --jq '[.[] | select(.ref == "refs/tags/nightly")] | length'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the nightly tag.' }
          if ([int]$tagCount -gt 0) {
            gh api --method PATCH "repos/$env:GH_REPO/git/refs/tags/nightly" -f "sha=$env:GITHUB_SHA" -F force=true
          } else {
            gh api --method POST "repos/$env:GH_REPO/git/refs" -f ref=refs/tags/nightly -f "sha=$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the nightly tag.' }

          $notes = Join-Path $env:RUNNER_TEMP 'nightly-notes.md'
          @"
          Automatically built from master. This is a development build.

          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          Download Sixboxx64ReleaseFreetypeAVX2.dll below. Third-party licenses and SHA256 checksums are included.
          "@ | Set-Content $notes -Encoding utf8
          $assets = @(Get-ChildItem output/release -File | ForEach-Object FullName)
          gh release view nightly *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload nightly @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Nightly asset upload failed.' }
            gh release edit nightly --title 'Sixbox TF2 Nightly (FreeType AVX2)' --notes-file $notes --prerelease --latest=false
          } else {
            gh release create nightly @assets --verify-tag --title 'Sixbox TF2 Nightly (FreeType AVX2)' --notes-file $notes --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Nightly release publication failed.' }
